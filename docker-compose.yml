name: course-scheduling
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      # M2: no default — refuse to boot with a trivial/blank password (fails `docker compose up` early).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-course_scheduling}
    ports:
      # M2: bind to loopback only — never expose Postgres to the LAN/internet. Intra-compose services
      # still reach it over the compose network at postgres:5432 (no host port needed for the app).
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-course_scheduling}']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        NODE_VERSION: 24.21.0-alpine
        # M5: NEXT_PUBLIC_APP_URL is baked in at build time — supply the real public origin here.
        NEXT_PUBLIC_APP_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-course_scheduling}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # P8: report-drafting provider + credentials. The standalone server does NOT read .env at
      # runtime, so these must be injected here or the container falls back to REPORT_PROVIDER's
      # 'anthropic' default and fails with "未配置 Claude API Key". Empty defaults keep them optional
      # (emptyStringAsUndefined in src/env.ts treats "" as unset); set the ones your provider needs.
      REPORT_PROVIDER: ${REPORT_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimaxi.com/v1}
    ports:
      - '3000:3000'
  test:
    profiles: ['test']
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-course_scheduling}
      NODE_ENV: test
    command: ['sh', '-c', 'node dist/migrate.mjs && npm run test']
volumes:
  pgdata: {}
